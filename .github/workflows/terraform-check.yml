# Static checks for EVERY Terraform directory in the repository.
# No AWS credentials are used: nothing here can create or read cloud
# resources, so it is safe to run on every pull request (including forks).
name: Terraform checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.16.4"
  TFLINT_VERSION: "v0.64.0"
  CHECKOV_VERSION: "3.3.19"
  TF_IN_AUTOMATION: "true"

# Every third-party action is pinned to a full commit SHA (the comment
# shows the matching release). Tags can be moved by whoever controls the
# action's repository; a SHA cannot. See docs/18-github-actions.
jobs:
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache
      # Reusable modules have no lock file; allow them to use the cache too.
      # Acceptable here because these jobs only validate, never apply.
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      # The AWS provider is large; download it once per lock-file change.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-
      - name: Validate every configuration
        run: ./scripts/validate-all.sh

  test:
    name: terraform test (modules, mocked)
    runs-on: ubuntu-latest
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.plugin-cache
      TF_PLUGIN_CACHE_MAY_BREAK_DEPENDENCY_LOCK_FILE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: mkdir -p "$TF_PLUGIN_CACHE_DIR"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/.terraform.lock.hcl') }}
          restore-keys: tf-plugins-${{ runner.os }}-
      # The module tests use mock_provider, so they create nothing in AWS.
      - name: Run module tests
        run: |
          for module in modules/*/; do
            echo "::group::${module}"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test
            echo "::endgroup::"
          done

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ runner.os }}-${{ hashFiles('.tflint.hcl') }}
      - uses: terraform-linters/setup-tflint@1cf010d3c7aef302051ccdb68c14c5dc2efa34ef # v6.3.1
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: Install rule plugins
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          # Avoids GitHub API rate limits when downloading plugins.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Lint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  security:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installed from PyPI at a pinned version instead of via a
      # third-party action: fewer moving parts in the supply chain.
      - name: Install Checkov
        run: pipx install "checkov==${CHECKOV_VERSION}"
      - name: Reusable code must pass (modules, projects)
        run: |
          checkov --config-file .checkov.yaml -d modules
          checkov --config-file .checkov.yaml -d projects
      - name: Learning examples (report only)
        run: |
          checkov --config-file .checkov.yaml -d examples --soft-fail
          checkov --config-file .checkov.yaml -d aws-services --soft-fail

  links:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative links and anchors
        run: python3 scripts/check-links.py
