# EDUCATIONAL: shows how a destroy CAN be automated safely. It is never
# triggered automatically and only targets DEV.
#
# Safeguards:
#   * manual trigger only (workflow_dispatch);
#   * you must type the confirmation phrase exactly;
#   * runs only from main;
#   * runs in the "dev" GitHub Environment, so its protection rules and
#     the dev-only AWS role apply. There is no prod option at all.
name: "Educational: destroy dev (manual)"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy-dev" to confirm'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.16.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  destroy:
    name: destroy (dev)
    if: inputs.confirm == 'destroy-dev' && github.ref == 'refs/heads/main' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: projects/09-production-style-infrastructure/environments/dev
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-destroy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="region=${AWS_REGION}"

      - name: Plan the destroy (shown in the job summary)
        run: |
          terraform plan -destroy -lock-timeout=5m -out=destroy.tfplan
          {
            echo "### Destroy plan (dev)"
            echo '```'
            terraform show -no-color destroy.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform apply (destroy)
        run: terraform apply -lock-timeout=5m destroy.tfplan
